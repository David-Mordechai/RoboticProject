[project]
name = "robotlab"
version = "0.1.0"
description = "Virtual lab for the two MentorPi A1 cars: mjlab tasks (MuJoCo Warp) + rsl_rl training, Microduck-style"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "warp-lang>=1.15",           # direct dep only so the NVIDIA index source below applies
    "onnxruntime>=1.20",
]

# One torch variant per machine (Docker build arg TORCH_VARIANT). Both PC (driver 617) and GB10 use cu130.
[project.optional-dependencies]
cu130 = ["torch>=2.14"]
cpu = ["torch>=2.14"]

[project.entry-points."mjlab.tasks"]
robotlab = "robotlab.tasks"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotlab"]

[tool.uv]
environments = ["sys_platform == 'linux'"]      # lock for Linux x86_64 (PC) + aarch64 (GB10)
conflicts = [[{ extra = "cu130" }, { extra = "cpu" }]]

[tool.uv.sources]
warp-lang = { index = "nvidia" }
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
