global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: false
      resolution: 0.05
      footprint: '[[0.119, 0.089], [0.119, -0.089], [-0.114, -0.089], [-0.114, 0.089]]'
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.4
        cost_scaling_factor: 4.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan depth_scan
        scan:
          topic: /scan_raw
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
        depth_scan:
          topic: /depth_scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      resolution: 0.05
      footprint: '[[0.119, 0.089], [0.119, -0.089], [-0.114, -0.089], [-0.114, 0.089]]'
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan depth_scan
        scan:
          topic: /scan_raw
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
        depth_scan:
          topic: /depth_scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false
      width: 3
      height: 3
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 3.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.4
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.9
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      allow_reversing: true
      use_rotate_to_heading: false
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: /home/ubuntu/shared/nav/navigate_ackermann_b.xml
    default_nav_through_poses_bt_xml: /home/ubuntu/shared/nav/navigate_ackermann_b.xml
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.5
    - 0.0
    - 1.5
    min_velocity:
    - -0.15
    - 0.0
    - -1.5
    max_accel:
    - 1.0
    - 0.0
    - 3.0
    max_decel:
    - -1.5
    - 0.0
    - -3.0
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_guard_in
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    - SlowZone
    FootprintApproach:
      type: polygon
      points:
      - 0.149
      - 0.119
      - 0.149
      - -0.119
      - -0.144
      - -0.119
      - -0.144
      - 0.119
      action_type: approach
      max_points: 3
      time_before_collision: 1.0
      simulation_time_step: 0.05
      visualize: false
    SlowZone:
      type: polygon
      points:
      - 0.519
      - 0.19
      - 0.519
      - -0.19
      - -0.314
      - -0.19
      - -0.314
      - 0.19
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.4
      visualize: false
    observation_sources:
    - scan
    - depth_scan
    scan:
      type: scan
      topic: /scan_raw
    depth_scan:
      type: scan
      topic: /depth_scan
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_raw
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.15
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    update_min_a: 0.2
    update_min_d: 0.1
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    bond_timeout: 0.0
    node_names:
    - map_server
    - amcl
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 0.0
    node_names:
    - controller_server
    - planner_server
    - behavior_server
    - bt_navigator
    - velocity_smoother
    - collision_monitor
